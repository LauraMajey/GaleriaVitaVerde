<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-title>Evidencias de Campo / Galería</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="gallery-content">
  <div class="ion-padding">
    <p style="color: #666; margin-bottom: 15px;">Captura imágenes en tiempo real de los productos y estados del Fruver:</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="6" size-md="4" size-lg="3" *ngFor="let photo of photoService.photos">
        <ion-card class="photo-card">
          <ion-img [src]="photo.webviewPath"></ion-img>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-fab vertical="bottom" horizontal="center" slot="fixed">
    <ion-fab-button color="success" (click)="photoService.addNewToGallery()">
      <ion-icon name="camera"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>

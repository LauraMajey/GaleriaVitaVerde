<ion-content class="create-content ion-padding">
  <div class="create-container ion-text-center">
    
    <div class="brand-wrapper">
      <div class="brand-logo">
        <img src="assets/logo.png" alt="VitaVerde Logo">
      </div>
      <h1 class="brand-title">VitaVerde</h1>
      <h2 class="info-title">Regístrate Gratis</h2>
      <p class="description-text">Crea tu cuenta para empezar a comprar</p>
    </div>

    <div class="form-wrapper">
      <ion-item lines="none" class="custom-input">
        <ion-icon name="person-outline" slot="start"></ion-icon>
        <ion-input type="text" placeholder="Nombre Completo" [(ngModel)]="name"></ion-input>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input type="email" placeholder="Correo Electrónico" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item lines="none" class="custom-input">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input type="password" placeholder="Contraseña" [(ngModel)]="password"></ion-input>
      </ion-item>
    </div>

    <ion-button expand="block" class="btn-half" color="success" (click)="btnRegistrarUsuario()">
      Registrarse
    </ion-button>

    <p class="clickable-text" (click)="irALogin()">
      ¿Ya tienes una cuenta? <strong>Inicia Sesión</strong>
    </p>

  </div>
</ion-content>
